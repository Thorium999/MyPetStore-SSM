<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${product.name} + ' | MyPetStore'">商品详情 | MyPetStore</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<!--
  详情页。Model：
    product         单个 Product（一商品一 SKU）
    images          List<ProductImage>（按 sort_order、id 升序，可能为空）
    category        所属二级分类；parentCategory 其一级
    soldOut         库存为 0
    maxQuantity     可购数量上限 = min(库存, 99)
-->
<body>

<div th:replace="~{fragments/layout :: siteHeader}"></div>

<main class="page">
    <div class="wrap">

        <nav class="breadcrumb">
            <a th:href="@{/main}">首页</a>
            <span th:if="${parentCategory}">/</span>
            <a th:if="${parentCategory}" th:href="@{/category(categoryId=${parentCategory.id})}"
               th:text="${parentCategory.name}">犬类</a>
            <span th:if="${category}">/</span>
            <a th:if="${category}" th:href="@{/category(categoryId=${category.id})}"
               th:text="${category.name}">宠物</a>
            <span>/</span>
            <span th:text="${product.name}">商品名</span>
        </nav>

        <div class="detail">

            <section class="gallery">
                <div class="gallery__main">
                    <img id="mainImage" th:src="@{'/' + ${product.coverImage}}" th:alt="${product.name}"/>
                    <span class="card__badge" th:if="${soldOut}">已售罄</span>
                </div>
                <div class="gallery__thumbs" th:if="${not #lists.isEmpty(images)}">
                    <button class="thumb" type="button" th:each="img : ${images}"
                            th:attr="data-src=@{'/' + ${img.imagePath}}"
                            th:title="${img.altText}">
                        <img th:src="@{'/' + ${img.imagePath}}" th:alt="${img.altText}"/>
                    </button>
                </div>
            </section>

            <section class="info">
                <h1 th:text="${product.name}">商品名</h1>
                <p class="info__summary" th:text="${product.summary}">一句话简介</p>

                <div class="info__row">
                    <span class="info__label">商品编码</span>
                    <span th:text="${product.sku}">SKU</span>
                </div>
                <div class="info__row">
                    <span class="info__label">库存</span>
                    <span th:if="${!soldOut}" th:text="${product.stock} + ' 件'">0 件</span>
                    <span class="is-out" th:if="${soldOut}">已售罄</span>
                </div>

                <p class="price price--lg">
                    <small>¥</small><span th:text="${#numbers.formatDecimal(product.price, 1, 2)}">0.00</span>
                </p>

                <form class="buy" method="post" th:action="@{/cart}">
                    <input type="hidden" name="productId" th:value="${product.id}"/>
                    <label class="buy__qty" for="quantity">数量</label>
                    <div class="qty">
                        <button class="qty__step" type="button" data-step="-1"
                                th:disabled="${soldOut}" aria-label="减少数量">−</button>
                        <input class="qty__input" id="quantity" type="number" name="quantity"
                               value="1" min="1" th:max="${maxQuantity}" step="1"
                               th:disabled="${soldOut}" aria-label="购买数量"/>
                        <button class="qty__step" type="button" data-step="1"
                                th:disabled="${soldOut}" aria-label="增加数量">+</button>
                    </div>
                    <button class="btn" type="submit" th:disabled="${soldOut}"
                            title="购物车模块接入后启用">加入购物车
                    </button>
                </form>
                <p class="hint" th:if="${soldOut}">该商品暂时无货</p>
            </section>

        </div>

        <section class="section" th:if="${not #strings.isEmpty(product.description)}">
            <div class="section__head">
                <h2>商品详情</h2>
            </div>
            <p class="desc" th:text="${product.description}">商品描述</p>
        </section>

    </div>
</main>

<div th:replace="~{fragments/layout :: siteFooter}"></div>

<script>
    document.querySelectorAll('.thumb').forEach(function (button) {
        button.addEventListener('click', function () {
            document.getElementById('mainImage').src = button.dataset.src;
        });
    });

    // 数量步进：点 ± 调整；手输越界在 change / 提交前夹回 1—max
    (function () {
        var input = document.getElementById('quantity');
        if (!input) {
            return;
        }
        var min = Number(input.min) || 1;
        var max = Number(input.max) || min;
        var clamp = function () {
            input.value = Math.min(Math.max(Number(input.value) || min, min), max);
        };

        document.querySelectorAll('.qty__step').forEach(function (button) {
            button.addEventListener('click', function () {
                var next = (Number(input.value) || min) + Number(button.dataset.step);
                input.value = Math.min(Math.max(next, min), max);
            });
        });

        input.addEventListener('change', clamp);
        if (input.form) {
            input.form.addEventListener('submit', clamp);
        }
    })();
</script>

</body>
</html>
