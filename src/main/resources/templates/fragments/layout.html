<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>片段</title>
</head>
<body>

<!-- 顶部：品牌 + 搜索 + 导航。登录/购物车/订单三处待对应模块实现后接真实 URL -->
<header class="app-header" th:fragment="siteHeader">
    <div class="wrap app-header__bar">
        <a class="brand" th:href="@{/main}">
            <img th:src="@{/images/logo.png}" alt="MyPetStore"/>
            <span class="brand__name">MyPet<b>Store</b></span>
        </a>

        <form class="search" method="get" th:action="@{/category}">
            <label class="sr-only" for="siteKeyword">搜索商品</label>
            <input id="siteKeyword" type="text" name="keyword" maxlength="120"
                   placeholder="搜索宠物、用品或 SKU"/>
            <button type="submit">搜索</button>
        </form>

        <nav class="app-nav">
            <span class="app-nav__user" th:if="${session.loginUser != null}"
                  th:text="${session.loginUser.displayName}">林同学</span>
            <a th:if="${session.loginUser == null}"
               th:href="@{/signon(returnUrl=${currentPath})}">登录</a>
            <form class="app-nav__logout" method="post" th:action="@{/signout}"
                  th:if="${session.loginUser != null}">
                <input type="hidden" name="_csrf" th:value="${csrfToken}"/>
                <button type="submit">退出</button>
            </form>
            <a class="cart" th:href="@{/cart}">购物车 <b th:text="${cartCount}">0</b></a>
            <a th:href="@{/orders}">我的订单</a>
        </nav>
    </div>
</header>

<footer class="app-footer" th:fragment="siteFooter">
    <div class="wrap">
        <span>MyPetStore · 课程教学演示项目，商品与价格均为虚构数据</span>
        <span>
            <a th:href="@{/main}">首页</a>
            &nbsp;·&nbsp;
            <a th:href="@{/category}">全部商品</a>
        </span>
    </div>
</footer>

<!-- 商品卡：首页两个栏目、列表页共用。参数是单个 Product -->
<article class="card" th:fragment="productCard(p)">
    <a class="card__media" th:href="@{/product(id=${p.id})}">
        <img th:src="@{'/' + ${p.coverImage}}" th:alt="${p.name}"/>
        <span class="card__badge" th:if="${p.stock == 0}">已售罄</span>
    </a>
    <div class="card__body">
        <a class="card__name" th:href="@{/product(id=${p.id})}" th:text="${p.name}">商品名</a>
        <span class="card__meta" th:text="${p.sku}">SKU</span>
        <div class="card__foot">
            <span class="price">
                <small>¥</small><span th:text="${#numbers.formatDecimal(p.price, 1, 2)}">0.00</span>
            </span>
            <span class="stock" th:text="${p.stock > 0 ? '库存 ' + p.stock : '暂时无货'}">库存</span>
        </div>
    </div>
</article>

<!--
  数量步进器：详情页和购物车共用，行为由 /js/qty.js 统一负责
  （只接受正整数、聚焦全选、± 夹在 1—max；表单带 data-autosubmit 时改动即提交）
-->
<div class="qty" th:fragment="qtyStepper(max, value, disabled, inputId)">
    <button class="qty__step" type="button" data-step="-1"
            th:disabled="${disabled}" aria-label="减少数量">−</button>
    <input class="qty__input" type="number" name="quantity" step="1"
           inputmode="numeric" autocomplete="off"
           th:id="${inputId}"
           th:value="${value}" min="1" th:max="${max}"
           th:disabled="${disabled}" aria-label="购买数量"/>
    <button class="qty__step" type="button" data-step="1"
            th:disabled="${disabled}" aria-label="增加数量">+</button>
</div>

</body>
</html>
