<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>MyPetStore | 商品列表</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<!--
  列表页。Model：
    nav          分类导航（左侧 5 个一级 + 各 2 个二级）
    page         分页结果（records / current / pages / total）
    categoryId   当前分类（可能为 null = 全部）
    productType  ALL / PETS / SUPPLIES
    sort         DEFAULT / PRICE_ASC / PRICE_DESC / NEWEST
    keyword      搜索词
-->
<body>

<div th:replace="~{fragments/layout :: siteHeader}"></div>

<main class="page">
    <div class="wrap">
        <div class="catalog">

            <aside class="rail">
                <a class="rail__all" th:href="@{/category}"
                   th:classappend="${categoryId == null} ? 'is-active'">全部商品</a>
                <div class="rail__group" th:each="n : ${nav}">
                    <a class="rail__title" th:href="@{/category(categoryId=${n.category.id})}"
                       th:classappend="${categoryId != null and categoryId == n.category.id} ? 'is-active'"
                       th:text="${n.category.name}">犬类</a>
                    <a class="rail__child" th:each="c : ${n.children}"
                       th:href="@{/category(categoryId=${c.id})}"
                       th:classappend="${categoryId != null and categoryId == c.id} ? 'is-active'"
                       th:text="${c.name}">宠物</a>
                </div>
            </aside>

            <section class="content">
                <div class="content__head">
                    <h1 th:text="${currentCategory != null ? currentCategory.name : '全部商品'}">全部商品</h1>
                    <span class="hint" th:if="${parentCategory != null}"
                          th:text="'所属大类：' + ${parentCategory.name}">所属大类</span>
                    <span class="hint" th:text="'共 ' + ${page.total} + ' 件'">共 0 件</span>
                </div>

                <div class="tools">
                    <div class="chips">
                        <a th:href="@{/category(categoryId=${categoryId}, productType='ALL', sort=${sort}, keyword=${keyword}, pageSize=${pageSize})}"
                           th:classappend="${productType == 'ALL'} ? 'is-active'">全部</a>
                        <a th:href="@{/category(categoryId=${categoryId}, productType='PETS', sort=${sort}, keyword=${keyword}, pageSize=${pageSize})}"
                           th:classappend="${productType == 'PETS'} ? 'is-active'">宠物</a>
                        <a th:href="@{/category(categoryId=${categoryId}, productType='SUPPLIES', sort=${sort}, keyword=${keyword}, pageSize=${pageSize})}"
                           th:classappend="${productType == 'SUPPLIES'} ? 'is-active'">用品</a>
                    </div>

                    <form class="tools__form" method="get" th:action="@{/category}">
                        <input type="hidden" name="productType" th:value="${productType}"/>
                        <input type="hidden" name="pageSize" th:value="${pageSize}"/>
                        <input type="hidden" name="categoryId" th:if="${categoryId != null}"
                               th:value="${categoryId}"/>

                        <input class="tools__input" type="text" name="keyword" maxlength="120"
                               th:value="${keyword}" placeholder="搜索商品名称"/>

                        <select class="tools__select" name="sort" onchange="this.form.submit()">
                            <option value="DEFAULT" th:selected="${sort == 'DEFAULT'}">默认排序</option>
                            <option value="PRICE_ASC" th:selected="${sort == 'PRICE_ASC'}">价格从低到高</option>
                            <option value="PRICE_DESC" th:selected="${sort == 'PRICE_DESC'}">价格从高到低</option>
                            <option value="NEWEST" th:selected="${sort == 'NEWEST'}">最新上架</option>
                        </select>

                        <button class="btn" type="submit">搜索</button>
                    </form>
                </div>

                <div class="shelf shelf--three" th:if="${not #lists.isEmpty(page.records)}">
                    <th:block th:each="p : ${page.records}">
                        <article th:replace="~{fragments/layout :: productCard(${p})}"></article>
                    </th:block>
                </div>
                <p class="empty" th:if="${#lists.isEmpty(page.records)}">
                    没有符合条件的商品，试试换个分类或清空搜索词
                </p>

                <nav class="pager" th:if="${page.pages > 1}">
                    <a th:each="i : ${#numbers.sequence(1, page.pages)}"
                       th:href="@{/category(categoryId=${categoryId}, productType=${productType}, sort=${sort}, keyword=${keyword}, pageSize=${pageSize}, page=${i})}"
                       th:text="${i}"
                       th:classappend="${i == page.current} ? 'is-active'">1</a>
                </nav>
            </section>

        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: siteFooter}"></div>

</body>
</html>
