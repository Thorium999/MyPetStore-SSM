<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>MyPetStore | 商品列表</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<!--
  列表页。页面状态统一为「一级分类 + 类型」，二者是不同维度：
    分类：全部 / 犬类 / 猫类 / 水族 / 鸟类 / 爬宠   （activeTopId）
    类型：全部 / 宠物 / 用品                      （productType）
  Model：nav、page、activeTopId、currentCategory、productType、sort、keyword、pageSize
-->
<body>

<div th:replace="~{fragments/layout :: siteHeader}"></div>

<main class="page">
    <div class="wrap">

        <div class="content__head">
            <h1>
                <span th:text="${currentCategory != null ? currentCategory.name : '全部商品'}">全部商品</span>
                <span th:if="${productType != 'ALL'}"
                      th:text="' · ' + (${productType == 'PETS'} ? '宠物' : '用品')"> · 宠物</span>
            </h1>
            <span class="hint" th:text="'共 ' + ${page.total} + ' 件'">共 0 件</span>
        </div>

        <div class="tools">
            <div class="tools__filters">
                <div class="tools__row">
                    <span class="tools__label">分类</span>
                    <div class="chips">
                        <a th:href="@{/category(productType=${productType}, sort=${sort}, keyword=${keyword}, pageSize=${pageSize})}"
                           th:classappend="${activeTopId == null} ? 'is-active'">全部</a>
                        <a th:each="n : ${nav}"
                           th:href="@{/category(categoryId=${n.category.id}, productType=${productType}, sort=${sort}, keyword=${keyword}, pageSize=${pageSize})}"
                           th:classappend="${activeTopId != null and activeTopId == n.category.id} ? 'is-active'"
                           th:text="${n.category.name}">犬类</a>
                    </div>
                </div>

                <div class="tools__row">
                    <span class="tools__label">类型</span>
                    <div class="chips">
                        <a th:href="@{/category(categoryId=${activeTopId}, productType='ALL', sort=${sort}, keyword=${keyword}, pageSize=${pageSize})}"
                           th:classappend="${productType == 'ALL'} ? 'is-active'">全部</a>
                        <a th:href="@{/category(categoryId=${activeTopId}, productType='PETS', sort=${sort}, keyword=${keyword}, pageSize=${pageSize})}"
                           th:classappend="${productType == 'PETS'} ? 'is-active'">宠物</a>
                        <a th:href="@{/category(categoryId=${activeTopId}, productType='SUPPLIES', sort=${sort}, keyword=${keyword}, pageSize=${pageSize})}"
                           th:classappend="${productType == 'SUPPLIES'} ? 'is-active'">用品</a>
                    </div>
                </div>
            </div>

            <form class="tools__form" method="get" th:action="@{/category}">
                <input type="hidden" name="productType" th:value="${productType}"/>
                <input type="hidden" name="pageSize" th:value="${pageSize}"/>
                <input type="hidden" name="categoryId" th:if="${activeTopId != null}" th:value="${activeTopId}"/>

                <input class="tools__input" type="text" name="keyword" maxlength="120"
                       th:value="${keyword}" placeholder="搜索商品名称"/>

                <select class="tools__select" name="sort" onchange="this.form.submit()">
                    <option value="DEFAULT" th:selected="${sort == 'DEFAULT'}">默认排序</option>
                    <option value="PRICE_ASC" th:selected="${sort == 'PRICE_ASC'}">价格从低到高</option>
                    <option value="PRICE_DESC" th:selected="${sort == 'PRICE_DESC'}">价格从高到低</option>
                    <option value="NEWEST" th:selected="${sort == 'NEWEST'}">最新上架</option>
                </select>

                <button class="btn" type="submit">搜索</button>
            </form>
        </div>

        <div class="shelf shelf--three" th:if="${not #lists.isEmpty(page.records)}">
            <th:block th:each="p : ${page.records}">
                <article th:replace="~{fragments/layout :: productCard(${p})}"></article>
            </th:block>
        </div>
        <p class="empty" th:if="${#lists.isEmpty(page.records)}">
            没有符合条件的商品，试试换个分类或清空搜索词
        </p>

        <nav class="pager" th:if="${page.pages > 1}">
            <a th:each="i : ${#numbers.sequence(1, page.pages)}"
               th:href="@{/category(categoryId=${activeTopId}, productType=${productType}, sort=${sort}, keyword=${keyword}, pageSize=${pageSize}, page=${i})}"
               th:text="${i}"
               th:classappend="${i == page.current} ? 'is-active'">1</a>
        </nav>

    </div>
</main>

<div th:replace="~{fragments/layout :: siteFooter}"></div>

</body>
</html>
