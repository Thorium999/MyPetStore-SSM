<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>请求被拒绝 | MyPetStore</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>

<div th:replace="~{fragments/layout :: siteHeader}"></div>

<main class="page">
    <div class="wrap">
        <div class="auth">
            <h1>请求被拒绝</h1>
            <p class="auth__lead">表单已过期或来源不可信（HTTP 403）。</p>
            <p class="auth__lead">常见原因是页面开了很久才提交，刷新一下再试即可。</p>
            <a class="btn" th:href="@{/main}">回到首页</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: siteFooter}"></div>

</body>
</html>
