spring:
  datasource:
    # 库名与 01/02 脚本一致：MyPetStore
    url: jdbc:mysql://localhost:3306/MyPetStore?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 本机 MySQL 密码：改这里，或设环境变量 MYSQL_PASSWORD（推荐，避免密码进 git）
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 建表/种子数据由手工导入 SQL 完成，应用启动时绝不自动建库或清库
      mode: never

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: PETSTORE_USER_SESSION

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 调试期把真实 SQL 打到控制台，交付前可关掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
