spring:
  config:
    # 本机私有配置（数据库密码等），文件不进 git；缺失时用环境变量 MYSQL_PASSWORD
    import: optional:classpath:application-local.yaml
  datasource:
    # 库名与 01/02 脚本一致：MyPetStore
    url: jdbc:mysql://localhost:3306/MyPetStore?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 建表/种子数据由手工导入 SQL 完成，应用启动时绝不自动建库或清库
      mode: never

server:
  port: 8080
  servlet:
    session:
      # 只用 cookie 跟踪会话：否则无 cookie 时 Tomcat 会把 ;JSESSIONID 拼进 URL 和 Location 里，
      # 既泄露会话号又难看
      tracking-modes: cookie
      timeout: 30m
      cookie:
        name: PETSTORE_USER_SESSION
        http-only: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 调试期把真实 SQL 打到控制台，交付前可关掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
